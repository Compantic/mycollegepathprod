# SonarQube / SonarCloud project key (replace with your actual key)
sonar.projectKey=Compantic_mycollegepathprod
sonar.organization=compantic-1

# Sources and exclusions
sonar.sources=app,components,lib
sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# JavaScript/TypeScript coverage (Jest LCOV)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Optional: test files for coverage context
sonar.tests=app,components,lib
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
