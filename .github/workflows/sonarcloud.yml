# SonarCloud: use EITHER this workflow (CI-based scan) OR SonarCloud "Automatic Analysis" — not both.
# If you see: "You are running CI analysis while Automatic Analysis is enabled"
# → SonarCloud → Project → Administration → Analysis Method → disable Automatic Analysis.
# See: https://docs.sonarcloud.io/advanced-setup/ci-based-analysis/

name: SonarCloud Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Generate coverage report
        run: npm run test:coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
